# API Gateway: ponto único de entrada. Serve o frontend e roteia /api/* para cada microserviço.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o endereço em variável, o nginx resolve o nome a cada
    # requisição: se um serviço reiniciar com outro IP, o gateway continua achando ele.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $veiculo http://veiculo-service:8081;
    set $estacionamento http://estacionamento-service:8082;
    set $cobranca http://cobranca-service:8083;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    location /api/veiculos {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $veiculo;
    }

    location /api/estadias {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $estacionamento;
    }

    location ~ ^/api/(cobrancas|planos|assinaturas) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $cobranca;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
