spring.application.name=estacionamento-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estacionamento_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# O horario de entrada e saida e sempre o do servidor, neste fuso
estacionamento.fuso-horario=America/Sao_Paulo

# Enderecos dos outros microservicos
servicos.veiculo.url=${SERVICOS_VEICULO_URL:http://localhost:8081}
servicos.cobranca.url=${SERVICOS_COBRANCA_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health
