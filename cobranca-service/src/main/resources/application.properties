spring.application.name=cobranca-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cobranca_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

estacionamento.fuso-horario=America/Sao_Paulo

# Cliente esporadico: valor por fracao de 15 minutos iniciada
cobranca.avulso.valor-fracao=${COBRANCA_VALOR_FRACAO:3.00}
cobranca.avulso.minutos-fracao=15

management.endpoints.web.exposure.include=health
