name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes-unitarios:
    name: Testes · ${{ matrix.servico }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [veiculo-service, estacionamento-service, cobranca-service]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.servico }}/pom.xml

      - name: Compilar e testar
        run: mvn -B test

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.servico }}
          path: ${{ matrix.servico }}/target/surefire-reports/
          if-no-files-found: ignore

  imagens:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: testes-unitarios
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build
